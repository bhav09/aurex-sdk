name: Aurex CI
description: Run Aurex FinOps cost & soft-failure regression check on PRs (warn-first by default)
inputs:
  mode:
    description: warn or block
    required: false
    default: warn
  baseline:
    description: Optional path to main-branch baseline ledger.jsonl
    required: false
    default: ""
  fail_on_regression:
    description: Set to "true" to fail CI when baseline diff detects a regression
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Run Aurex CI
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail_on_regression }}
      run: |
        ARGS=("--mode=${INPUT_MODE}" "--github-comment")
        if [ -n "${INPUT_BASELINE}" ]; then
          ARGS+=("--baseline=${INPUT_BASELINE}")
        fi
        if [ "${INPUT_FAIL_ON_REGRESSION}" = "true" ]; then
          ARGS+=("--fail-on-regression")
        fi
        npx aurex ci "${ARGS[@]}"
