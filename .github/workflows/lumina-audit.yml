name: Lumina Token Waste Auditor
on:
  pull_request:
    paths:
      - 'usage.csv'
      - 'logs/*.csv'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Lumina Audit
        id: audit
        run: |
          # Assuming you have a standard usage.csv in your root folder
          # Or pass an env var or dynamic path
          npx tsx cli/index.ts usage.csv > audit-report.md
          echo "REPORT<<EOF" >> $GITHUB_OUTPUT
          cat audit-report.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ${{ steps.audit.outputs.REPORT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
