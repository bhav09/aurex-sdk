[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aurex-sdk"
version = "0.4.2"
description = "Aurex Python SDK - In-process AI runtime layer for AI applications and agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aurex = "aurex_sdk.cli:run_cli"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
litellm = ["litellm>=1.0.0"]
google = ["google-genai>=1.0.0"]
google-legacy = ["google-generativeai>=0.3.0"]
huggingface = ["huggingface_hub>=0.19.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aurex_sdk*"]
