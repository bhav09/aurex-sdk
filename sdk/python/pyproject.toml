[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurex-sdk"
version = "0.5.4"
license = "MIT"
description = "In-process LLM FinOps shield, runtime circuit breaker, and CI outcome gate for Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Bhavishya Pandit" },
    { name = "Aakriti Aggarwal" },
]
keywords = [
    "llm",
    "finops",
    "ai-agents",
    "openai",
    "anthropic",
    "gemini",
    "prompt-caching",
    "circuit-breaker",
    "guardrails",
    "opentelemetry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "tiktoken>=0.7.0",
]

[project.urls]
Homepage = "https://bhav09.github.io/aurex-sdk/"
Repository = "https://github.com/bhav09/aurex-sdk"
Documentation = "https://bhav09.github.io/aurex-sdk/"
Issues = "https://github.com/bhav09/aurex-sdk/issues"

[project.scripts]
aurex = "aurex_sdk.cli:run_cli"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
google = ["google-genai>=1.0.0"]
google-legacy = ["google-generativeai>=0.3.0"]
litellm = ["litellm>=1.110.3"]
ollama = ["ollama>=0.3.0"]
huggingface = ["huggingface_hub>=0.19.0"]
redis = ["redis>=5.0.0"]
otel = ["opentelemetry-api>=1.45.2"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "google-genai>=1.0.0",
    "litellm>=1.110.3",
    "ollama>=0.3.0",
    "huggingface_hub>=0.19.0",
    "redis>=5.0.0",
    "opentelemetry-api>=1.45.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aurex_sdk*"]

[tool.setuptools.package-data]
aurex_sdk = ["py.typed"]
