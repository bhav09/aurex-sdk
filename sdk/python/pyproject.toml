[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurex-sdk"
version = "0.1.0"
description = "Aurex AI FinOps SDK — zero-code LLM cost auditing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Aurex" }]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
google = ["google-generativeai>=0.5"]
litellm = ["litellm>=1.40"]
dev = ["pytest>=7.0"]

[project.scripts]
aurex = "aurex_sdk.cli:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["aurex_sdk*"]
