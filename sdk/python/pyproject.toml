[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aurex-python"
version = "0.1.0"
description = "Aurex Python SDK — auto-instrument OpenAI, Anthropic, LiteLLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
litellm = ["litellm>=1.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aurex_sdk*"]
